<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Каталог ИИ-сервисов</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="container">
      <h1>Каталог ИИ-сервисов</h1>
      <p class="subtitle">
        Подборка сервисов для работы с текстом, картинками, озвучкой и видео
      </p>

      <div class="search-panel">
        <input
          type="text"
          id="searchInput"
          placeholder="Найти сервис по названию"
          aria-label="Поиск сервиса"
        />
      </div>

      <div class="filters">
        <button class="filter-btn active" data-category="Все">Все</button>
        <button class="filter-btn" data-category="Текст">Текст</button>
        <button class="filter-btn" data-category="Картинки">Картинки</button>
        <button class="filter-btn" data-category="Озвучка">Озвучка</button>
        <button class="filter-btn" data-category="Видео">Видео</button>
      </div>

      <label class="toggle">
        <input type="checkbox" id="universalOnly" />
        <span>Показать только универсальные сервисы</span>
      </label>
    </div>
  </header>

  <main class="container">
    <div class="results-bar">
      <p id="resultsCount">Найдено: 0</p>
    </div>

    <section id="cards" class="cards"></section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Каталог ИИ-сервисов</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
